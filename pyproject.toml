[project]
name = "agentic-coding-sandbox"
version = "0.1.0"
description = "Self-correcting agentic coding sandbox with Docker isolation"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4,<1.0",
    "langchain-core>=0.3,<1.0",
    "openai>=1.70,<2.0",
    "docker>=7.0,<8.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "streamlit>=1.42,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<1.0",
]
